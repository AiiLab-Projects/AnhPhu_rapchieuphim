name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set backend WebSocket URL
        env:
          CINEMA_WS_URL: ${{ vars.CINEMA_WS_URL }}
        run: |
          node -e 'const fs=require("node:fs"); const value=JSON.stringify(process.env.CINEMA_WS_URL || ""); fs.writeFileSync("frontend/config.js", `window.CINEMA_WS_URL = ${value};\n`);'

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
